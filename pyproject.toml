[project]
name = "zb-studio"
version = "0.5.2"
description = "ZB Studio task workflow desktop-ready backend"
requires-python = ">=3.10"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
