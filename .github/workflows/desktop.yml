name: Desktop tests and builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libxcb-xinerama0
      - run: python -m pip install --upgrade pip==26.2.2
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m zb_studio.desktop --smoke-test
      - run: python build_desktop.py
      - name: Packaged startup smoke test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            dist/ZBStudio/ZBStudio.exe --smoke-test
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            dist/ZBStudio.app/Contents/MacOS/ZBStudio --smoke-test
          else
            dist/ZBStudio/ZBStudio --smoke-test
          fi
      - name: Build native installer
        run: python build_installers.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ZBStudio-${{ runner.os }}-${{ runner.arch }}
          path: installers/
          retention-days: 14
